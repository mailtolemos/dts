# Fly.io config for the DTS background worker.
# Headless (no [http_service]) — Fly keeps it alive as a long-running process.

app = "dts-worker"
primary_region = "iad"   # Same region as the Vercel app + Neon DB.

kill_signal  = "SIGTERM"
kill_timeout = "10s"

[build]

[env]
  NODE_ENV  = "production"
  LOG_LEVEL = "info"

# Free-tier sizing: shared-cpu-1x with 256 MB is plenty for this worker.
[[vm]]
  size      = "shared-cpu-1x"
  memory    = "256mb"
  cpu_kind  = "shared"
  cpus      = 1
