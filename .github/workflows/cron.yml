name: DTS cron

on:
  schedule:
    - cron: '*/5 * * * *'    # every 5 min — refresh + regime
    - cron: '*/15 * * * *'   # every 15 min — analyst + news
    - cron: '0 6 * * *'      # daily 06:00 UTC — sync Pyth catalog
  workflow_dispatch:           # manual trigger from Actions tab

concurrency:
  group: dts-cron-${{ github.event.schedule }}
  cancel-in-progress: false

jobs:
  refresh-and-regime:
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: refresh
        env: { DTS_URL: '${{ vars.DTS_URL }}', CRON_SECRET: '${{ secrets.CRON_SECRET }}' }
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(curl --fail-with-body -sS -X POST "$DTS_URL/api/cron/refresh" \
            -H "Authorization: Bearer $CRON_SECRET" --max-time 90) || { echo "FAILED: $BODY"; exit 1; }
          echo "$BODY" | jq .
      - name: regime
        env: { DTS_URL: '${{ vars.DTS_URL }}', CRON_SECRET: '${{ secrets.CRON_SECRET }}' }
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(curl --fail-with-body -sS -X POST "$DTS_URL/api/cron/regime" \
            -H "Authorization: Bearer $CRON_SECRET" --max-time 45) || { echo "FAILED: $BODY"; exit 1; }
          echo "$BODY" | jq .

  analyst-and-news:
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: analyst (rotating batch)
        env: { DTS_URL: '${{ vars.DTS_URL }}', CRON_SECRET: '${{ secrets.CRON_SECRET }}' }
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(curl --fail-with-body -sS -X POST "$DTS_URL/api/cron/analyst" \
            -H "Authorization: Bearer $CRON_SECRET" --max-time 90) || { echo "FAILED: $BODY"; exit 1; }
          echo "$BODY" | jq .
      - name: news
        env: { DTS_URL: '${{ vars.DTS_URL }}', CRON_SECRET: '${{ secrets.CRON_SECRET }}' }
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(curl --fail-with-body -sS -X POST "$DTS_URL/api/cron/news" \
            -H "Authorization: Bearer $CRON_SECRET" --max-time 90) || { echo "FAILED: $BODY"; exit 1; }
          echo "$BODY" | jq .

  sync-catalog:
    if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: sync Pyth catalog
        env: { DTS_URL: '${{ vars.DTS_URL }}', CRON_SECRET: '${{ secrets.CRON_SECRET }}' }
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(curl --fail-with-body -sS -X POST "$DTS_URL/api/cron/sync-catalog" \
            -H "Authorization: Bearer $CRON_SECRET" --max-time 300) || { echo "FAILED: $BODY"; exit 1; }
          echo "$BODY" | jq .
